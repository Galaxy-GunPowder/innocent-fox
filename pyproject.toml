[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "innocent-fox"
version = "0.2.3"
description = "Scriptable anti-detect browser built on Firefox: each profile is one identity (device, Firefox version, proxy, location), driven from Python over a private pipe."
readme = "docs/scripting.md"
requires-python = ">=3.10"
dependencies = []          # standard library only
license = {text = "MPL-2.0"}
classifiers = ["Operating System :: Microsoft :: Windows",
               "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)"]

[project.urls]
Homepage = "https://github.com/Galaxy-GunPowder/innocent-fox"

[project.scripts]
ifox-open = "ifox.desktop:main_safe"
ifox-install = "ifox.install:main"

[tool.setuptools]
packages = ["ifox"]

[tool.setuptools.package-data]
ifox = ["*.json"]
