<!doctype html>
<html>
<head><meta charset="utf-8"><title>WebRTC leak test</title></head>
<body>
<pre id="report"></pre>
<script>
  // What a detection script does: gather ICE candidates through a public STUN
  // server and read every address in them and in the SDP.
  (async () => {
    const out = { candidates: [], sdp: "", error: null };
    try {
      const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
      pc.createDataChannel("probe");
      const done = new Promise(resolve => {
        pc.onicecandidate = e => {
          if (e.candidate && e.candidate.candidate) out.candidates.push(e.candidate.candidate);
          else if (!e.candidate) resolve();
        };
        setTimeout(resolve, 10000);
      });
      await pc.setLocalDescription(await pc.createOffer());
      await done;
      out.sdp = pc.localDescription.sdp;
      pc.close();
    } catch (e) {
      out.error = String(e);
    }
    document.getElementById("report").textContent = JSON.stringify(out);
  })();
</script>
</body>
</html>
